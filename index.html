<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEA Migrant Workers Clearance Verification</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 16px;
            color: #212529;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 8px;
            padding: 32px 24px 24px 24px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        .logo {
            width: 75px;
            height: auto;
            margin-bottom: 20px;
        }
        .main-title {
            color: #004b87;
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 6px 0;
        }
        .sub-title {
            color: #6c757d;
            font-size: 13.5px;
            margin: 0 0 24px 0;
        }
        .badge {
            background-color: #e6f9f0;
            color: #00a859;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 16px;
        }
        .badge.invalid {
            background-color: #fce8e6;
            color: #c5221f;
        }
        .status-header {
            font-size: 19px;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0 0 12px 0;
        }
        .status-desc {
            font-size: 14px;
            color: #666666;
            line-height: 1.45;
            margin: 0 0 28px 0;
            padding: 0 8px;
        }
        .divider {
            border-top: 1px solid #f0f0f0;
            margin-bottom: 20px;
        }
        .section-heading {
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #7d858c;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .details-container {
            text-align: left;
        }
        .field-group {
            margin-bottom: 16px;
        }
        .field-label {
            font-size: 12px;
            color: #828a91;
            margin-bottom: 3px;
        }
        .field-value {
            font-size: 15px;
            font-weight: 700;
            color: #111111;
            line-height: 1.3;
        }
        .footer {
            margin-top: 32px;
            border-top: 1px solid #f0f0f0;
            padding-top: 18px;
            font-size: 11.5px;
            color: #757575;
            line-height: 1.6;
            text-align: center;
        }
        .footer a {
            color: #004b87;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- NEA Logo (falls back cleanly if image is missing) -->
    <img src="https://raw.githubusercontent.com/http-api-neaims-go-ke-verifyattestation/CertNEA/main/image2.png" alt="NEA Logo" class="logo">

    <h1 class="main-title">NEA Migrant Workers Clearance</h1>
    <div class="sub-title">National Employment Authority of Kenya</div>

    <div id="content">
        <p style="color: #888; font-size: 13px;">Verifying certificate record...</p>
    </div>

    <div class="footer">
        Verified at <a href="https://nea.go.ke" target="_blank">nea.go.ke</a> &bull; NEA Toll-Free <b>0800 222 223</b><br>
        <span id="cert-footer-id">Certificate No.: —</span>
    </div>
</div>

<script>
    async function verifyCertificate() {
        const urlParams = new URLSearchParams(window.location.search);
        const certNo = urlParams.get('cert') ? urlParams.get('cert').trim() : '';
        const contentDiv = document.getElementById('content');
        const certFooterId = document.getElementById('cert-footer-id');

        if (!certNo) {
            renderInvalid('No Certificate Provided');
            return;
        }

        certFooterId.innerText = `Certificate No.: ${certNo}`;

        try {
            // Absolute path detection for GitHub Pages sub-folders
            const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            const jsonUrl = `${window.location.origin}${basePath}/database.json?v=${new Date().getTime()}`;
            
            console.log("Fetching database from:", jsonUrl);
            const response = await fetch(jsonUrl);
            if (!response.ok) throw new Error('HTTP error ' + response.status);
            
            const DATABASE = await response.json();
            console.log("Database loaded successfully. Keys found:", Object.keys(DATABASE));

            if (DATABASE[certNo]) {
                const data = DATABASE[certNo];
                contentDiv.innerHTML = `
                    <div class="badge">&#10003; Verified</div>
                    <div class="status-header">This certificate is valid</div>
                    <div class="status-desc">
                        Issued by the National Employment Authority of Kenya. The details below match the official record.
                    </div>

                    <div class="divider"></div>

                    <div class="section-heading">CERTIFICATE DETAILS</div>
                    
                    <div class="details-container">
                        <div class="field-group"><div class="field-label">Holder</div><div class="field-value">${data.holder}</div></div>
                        <div class="field-group"><div class="field-label">Destination</div><div class="field-value">${data.destination}</div></div>
                        <div class="field-group"><div class="field-label">Employer</div><div class="field-value">${data.employer}</div></div>
                        <div class="field-group"><div class="field-label">Position</div><div class="field-value">${data.position}</div></div>
                        <div class="field-group"><div class="field-label">Recruiting Agency</div><div class="field-value">${data.agency}</div></div>
                        <div class="field-group"><div class="field-label">Attested by</div><div class="field-value">${data.attestedBy}</div></div>
                        <div class="field-group"><div class="field-label">Date of Attestation</div><div class="field-value">${data.dateAttested}</div></div>
                    </div>
                `;
            } else {
                renderInvalid(certNo);
            }
        } catch (error) {
            console.error("Fetch error:", error);
            renderInvalid(certNo);
        }
    }

    function renderInvalid(certNo) {
        document.getElementById('cert-footer-id').innerText = `Certificate No.: ${certNo || 'Unknown'}`;
        document.getElementById('content').innerHTML = `
            <div class="badge invalid">&#10007; Invalid</div>
            <div class="status-header" style="color: #c5221f;">Certificate Not Found</div>
            <div class="status-desc">
                The certificate number provided does not exist or is invalid in the National Employment Authority database.
            </div>
        `;
    }

    verifyCertificate();
</script>

</body>
</html>
